# Copy to config.yaml or set NCORE_* environment variables.
host: "0.0.0.0"
port: 9090
dry_run: false

# Prefer a stable by-id symlink: ls /dev/serial/by-id
serial_port: "/dev/ttyUSB0"
serial_baud: 115200

# Pi4J WiringPi GPIO_09 = BCM 3 (I2C SCL). Do not enable I2C on this Pi.
gpio_bcm_pin: 3

# Official 7" DSI (hypex-amp has /sys/class/backlight/rpi_backlight).
# Amp on/off writes brightness 80 / 0. hdmi_force_hotplug=1 may also be in
# config.txt; HDMI power is only used if this backlight path is missing.
backlight_path: "/sys/class/backlight/rpi_backlight/brightness"
backlight_max: 80
display_hdmi_power: true

# Match a substring of the evdev device name (not a hardcoded event2 number).
ir_device_name: ""
ir_device_path: "/dev/input/event2"
ir_repeat_delay_ms: 500
ir_repeat_period_ms: 150

# Home Assistant (server elsewhere): webhook + Chromium kiosk URL
# ha_webhook_url: "http://homeassistant.local:8123/api/webhook/ncore_updated"
ha_webhook_url: ""
ha_kiosk_url: "http://homeassistant.local:8123"

state_path: "state.json"

max_volume: 80
power_on_volume: 9
power_on_restore_cap: 20
volume_step_interval_ms: 150
power_on_settle_ms: 50
